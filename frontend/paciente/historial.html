<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TurnoRural - Historial</title><link rel="stylesheet" href="/css/estilos.css"></head>
<body><header><h1>TurnoRural</h1><nav><span id="nombreUsuario"></span><a href="/paciente/">Pedir turno</a><a href="/paciente/mi-turno.html">Mi turno</a><a href="/paciente/historial.html">Historial</a><a href="/perfil.html">Mi perfil</a><button id="btnSalir">Cerrar sesión</button></nav></header><main>
<div class="tarjeta"><h2>Historial de turnos</h2><p class="gris">Turnos de los últimos 12 meses, del más reciente al más antiguo.</p>
<label for="estado">Filtrar por estado</label><select id="estado"><option value="">Todos</option><option value="Asignado">En espera</option><option value="Atendido">Atendido</option><option value="NoAsistio">No llegó</option><option value="Cancelado">Cancelado</option><option value="CanceladoNovedad">Cancelado por novedad</option></select>
<div id="msg" class="msg"></div><div id="tabla" style="margin-top:12px"></div>
<div class="fila" style="margin-top:10px"><button class="btn sec" id="ant">Anterior</button><span class="centro" id="pag"></span><button class="btn sec" id="sig">Siguiente</button></div></div>
</main><script src="/js/comun.js"></script><script>
let pagina = 1, total = 1;
async function cargar() {
  try { const r = await api('GET', `/turnos/historial?pagina=${pagina}&estado=${estado.value}`); total = r.totalPaginas;
    tabla.innerHTML = r.turnos.length ? '<table><tr><th>Fecha</th><th>Puesto</th><th>No.</th><th>Estado</th><th>Detalle</th></tr>' + r.turnos.map((t) =>
      `<tr><td>${t.fecha}</td><td>${esc(t.puesto)}</td><td>${t.numero}</td><td>${chip(t.estado)}</td><td class="gris">${esc(t.motivo_cancelacion || t.novedad || '')}</td></tr>`).join('') + '</table>' : '<p>Aún no tienes turnos registrados.</p>';
    pag.textContent = `Página ${r.pagina} de ${r.totalPaginas} (${r.total} turnos)`; ant.disabled = pagina <= 1; sig.disabled = pagina >= total;
  } catch (e) { mostrar('msg', e.message, 'error'); } }
estado.onchange = () => { pagina = 1; cargar(); }; ant.onclick = () => { pagina--; cargar(); }; sig.onclick = () => { pagina++; cargar(); };
iniciarSesionSegura('Paciente').then(cargar);
</script></body></html>
